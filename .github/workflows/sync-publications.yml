name: Sync Publications

# Runs daily at 06:15 UTC (15 min after the Scholar metrics workflow so they
# don't race for the auto-deploy slot).
on:
  schedule:
    - cron: "15 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write   # bot needs to commit the updated JSON

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: |
          python -m pip install --upgrade pip
          pip install "requests>=2.31,<3"

      - name: Fetch publications from Google Sites + Crossref
        timeout-minutes: 3
        run: python .github/scripts/fetch-publications.py

      - name: Commit changes (if any)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain public/sites-publications.json)" ]]; then
            git add public/sites-publications.json
            git commit -m "chore(publications): auto-sync from Google Sites"
            git push
            echo "Pushed publications update."
          else
            echo "No change."
          fi
