name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Auto-deploy after the daily Scholar metrics workflow lands a new commit.
  # (GitHub deliberately does not re-trigger workflows from pushes made with the
  # default GITHUB_TOKEN, so we wire this in explicitly.)
  workflow_run:
    workflows: ["Update Scholar Metrics", "Sync Publications"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  Build:
    runs-on: ubuntu-latest
    # When triggered by the Scholar workflow, only deploy if it actually
    # succeeded — no point rebuilding for a failed metrics fetch.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          clean: true
          single-commit: true
